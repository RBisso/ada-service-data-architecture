name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/ada

jobs:
  build-and-test:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-proxy ./nginx
          docker build -t ${{ env.IMAGE_PREFIX }}-frontend ./frontend
          docker build -t ${{ env.IMAGE_PREFIX }}-backend ./backend

      - name: Start services
        run: docker compose up -d
        env:
          COMPOSE_BUILD: "false"

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if docker exec api_backend wget -qO- http://localhost:8080/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 3
          done
          echo "Backend failed to become healthy"
          docker compose logs
          exit 1

      - name: Smoke test - health check
        run: |
          echo "Testing /health endpoint..."
          curl -sf http://localhost/health || (echo "FAIL: /health" && exit 1)

          echo "Testing GET /api/products..."
          curl -sf http://localhost/api/products || (echo "FAIL: GET /api/products" && exit 1)

          echo "Testing POST /api/products..."
          curl -sf -X POST http://localhost/api/products \
            -H "Content-Type: application/json" \
            -d '{"name":"CI-Test"}' || (echo "FAIL: POST /api/products" && exit 1)

          echo "All smoke tests passed!"

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          TAG=${{ github.ref_name }}
          docker tag ${{ env.IMAGE_PREFIX }}-proxy ${{ env.IMAGE_PREFIX }}-proxy:$TAG
          docker tag ${{ env.IMAGE_PREFIX }}-frontend ${{ env.IMAGE_PREFIX }}-frontend:$TAG
          docker tag ${{ env.IMAGE_PREFIX }}-backend ${{ env.IMAGE_PREFIX }}-backend:$TAG

          docker push ${{ env.IMAGE_PREFIX }}-proxy:$TAG
          docker push ${{ env.IMAGE_PREFIX }}-frontend:$TAG
          docker push ${{ env.IMAGE_PREFIX }}-backend:$TAG

name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy no servidor
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 161.35.57.162
      DEPLOY_USER: root
      DEPLOY_PATH: /opt/ada-service-data-architecture
      DEPLOY_LOG_FILE: /var/log/ada-service-data-architecture/deploy.log
      DEPLOY_EXIT_CODE_FILE: /var/run/ada-service-data-architecture/deploy.exit
      SSH_OPTIONS: -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar chave SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["SSH_PRIVATE_KEY"]
          normalized_key = key.replace("\r\n", "\n").replace("\r", "\n").replace("\\n", "\n").strip() + "\n"

          Path.home().joinpath(".ssh", "id_ed25519").write_text(normalized_key)
          PY

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Validar conexao SSH
        shell: bash
        run: ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "echo Conexao SSH validada com sucesso."

      - name: Sincronizar arquivos no servidor
        shell: bash
        run: |
          rsync -avz --delete \
            -e "ssh ${SSH_OPTIONS}" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "ai-log.md" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Iniciar deploy remoto em background
        shell: bash
        run: |
          ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "\
            mkdir -p /var/log/ada-service-data-architecture /var/run/ada-service-data-architecture && \
            rm -f ${DEPLOY_EXIT_CODE_FILE} && \
            chmod +x ${DEPLOY_PATH}/scripts/deploy_remote.sh && \
            nohup bash -lc 'cd ${DEPLOY_PATH} && ./scripts/deploy_remote.sh' \
              > ${DEPLOY_LOG_FILE} 2>&1 < /dev/null & \
            echo \$! > /var/run/ada-service-data-architecture/deploy.pid && \
            echo Deploy iniciado com PID \$(cat /var/run/ada-service-data-architecture/deploy.pid)"

      - name: Acompanhar deploy remoto
        shell: bash
        run: |
          for tentativa in $(seq 1 60); do
            status=$(ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "\
              if [ -f ${DEPLOY_EXIT_CODE_FILE} ]; then \
                cat ${DEPLOY_EXIT_CODE_FILE}; \
              else \
                echo RUNNING; \
              fi")

            echo "Tentativa ${tentativa}/60 - status: ${status}"

            if [ "${status}" = "0" ]; then
              ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "tail -n 40 ${DEPLOY_LOG_FILE} || true"
              exit 0
            fi

            if [ "${status}" != "RUNNING" ]; then
              ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "tail -n 120 ${DEPLOY_LOG_FILE} || true"
              echo "Deploy remoto falhou."
              exit 1
            fi

            if [ $((tentativa % 6)) -eq 0 ]; then
              ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "tail -n 20 ${DEPLOY_LOG_FILE} || true"
            fi

            sleep 10
          done

          echo "Deploy remoto excedeu o tempo limite."
          ssh ${SSH_OPTIONS} "${DEPLOY_USER}@${DEPLOY_HOST}" "tail -n 120 ${DEPLOY_LOG_FILE} || true"
          exit 1

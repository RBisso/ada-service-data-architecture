name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy no servidor
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 161.35.57.162
      DEPLOY_USER: root
      DEPLOY_PATH: /opt/ada-service-data-architecture

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar chave SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["SSH_PRIVATE_KEY"]
          normalized_key = key.replace("\r\n", "\n").replace("\r", "\n").replace("\\n", "\n").strip() + "\n"

          Path.home().joinpath(".ssh", "id_ed25519").write_text(normalized_key)
          PY

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Validar conexao SSH
        shell: bash
        run: ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "echo Conexao SSH validada com sucesso."

      - name: Sincronizar arquivos no servidor
        shell: bash
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "ai-log.md" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Executar deploy remoto
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod +x ${DEPLOY_PATH}/scripts/deploy_remote.sh && ${DEPLOY_PATH}/scripts/deploy_remote.sh"

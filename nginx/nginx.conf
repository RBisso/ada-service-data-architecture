server {
    listen 80;
    resolver 127.0.0.11;

    location = /openapi.json {
        set $backend_openapi http://backend:8080;
        proxy_pass $backend_openapi/openapi.json;
    }

    location = /swagger {
        set $backend_swagger http://backend:8080;
        proxy_pass $backend_swagger/swagger;
    }

    location = /swagger/ {
        set $backend_swagger_root http://backend:8080;
        proxy_pass $backend_swagger_root/swagger/;
    }

    location /health {
        set $backend_health http://backend:8080;
        proxy_pass $backend_health/health;
    }

    location /api/ {
        set $backend_api http://backend:8080;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
    }
}
